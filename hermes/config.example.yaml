# Hermes Agent TTS provider 設定範例
#
# 複製到 ~/.hermes/config.yaml 的 tts 區塊，或合併進既有設定。
#
# 前置步驟：
# 1. 啟動 IndexTTS API 服務（預設 port 8001）
# 2. 以 POST /v1/voices 上傳參考音檔，取得 voice_id
# 3. 設定 INDEXTTS_DEFAULT_VOICE_ID 環境變數（或 source repo 根目錄 .env）
#
# 目前預設 reference voice（reference_voice/temp_voice_1.wav）：
#   export INDEXTTS_DEFAULT_VOICE_ID=96111604101b4d3bbdd65295aa63b538
#
# 服務跑的是 IndexTTS 2.5，輸出為 22050 Hz WAV。bridge 可選的環境變數：
#   export INDEXTTS_LANG=zh              # zh / en / ja / ar / es
#   export INDEXTTS_DURATION_FACTOR=1.0  # 0.5 最快 ~ 2.0 最慢
#   export INDEXTTS_USE_EMO_TEXT=1       # 依文字推情感
#   export INDEXTTS_EMO_ALPHA=0.6
#
# 對應的 bridge 旗標：--lang / --duration-factor / --use-emo-text / --emo-alpha

tts:
  provider: indextts
  providers:
    indextts:
      type: command
      command: "indextts-hermes-bridge --text-file {input_path} --out {output_path}"
      output_format: wav
      timeout: 180
      voice_compatible: true
      max_text_length: 5000

# 若 Hermes 跑在 Docker 內、API 在宿主機：
#
# tts:
#   provider: indextts
#   providers:
#     indextts:
#       type: command
#       command: "indextts-hermes-bridge --api-url http://host.docker.internal:8001 --text-file {input_path} --out {output_path}"
#       output_format: wav
#       timeout: 180
#       voice_compatible: true

# 指定語言／語速（也可用環境變數，見上方）：
#
#       command: "indextts-hermes-bridge --lang en --duration-factor 1.2 --text-file {input_path} --out {output_path}"
